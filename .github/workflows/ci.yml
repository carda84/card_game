name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ===== 后端单元测试 =====
  unit-test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cardgame_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: card/backend/pom.xml

      - name: Run backend tests
        working-directory: card/backend
        env:
          DB_URL: jdbc:mysql://localhost:3306/cardgame_test?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
          DB_USERNAME: root
          DB_PASSWORD: root
          JWT_SECRET: ci-test-secret-key-at-least-32-chars-long
          MAIL_USERNAME: test@example.com
          MAIL_PASSWORD: test
        run: mvn test -B

  # ===== 前端构建验证 =====
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: card/frontend/package-lock.json

      - name: Install dependencies
        working-directory: card/frontend
        run: npm ci

      - name: Build frontend
        working-directory: card/frontend
        run: npm run build

  # ===== Docker Compose 构建验证 =====
  docker-build:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    needs: [unit-test, build-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Compose
        env:
          DB_PASSWORD: ci-test-password
          JWT_SECRET: ci-test-secret-key-at-least-32-chars-long
          MAIL_USERNAME: test@example.com
          MAIL_PASSWORD: test
        run: docker compose build
