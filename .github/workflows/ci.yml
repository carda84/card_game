name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  unit-test:
    name: unit-test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cardgame_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests
        working-directory: card/backend
        env:
          DB_URL: jdbc:mysql://localhost:3306/cardgame_test?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
          DB_USERNAME: root
          DB_PASSWORD: root
          JWT_SECRET: ci-test-secret-key-at-least-32-chars-long
          MAIL_USERNAME: test@example.com
          MAIL_PASSWORD: test
        run: mvn test -B

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: card/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: card/frontend
        run: npm ci

      - name: Build frontend
        working-directory: card/frontend
        run: npm run build

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs: unit-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Compose
        env:
          DB_PASSWORD: ci-test-password
          JWT_SECRET: ci-test-secret-key-at-least-32-chars-long
          MAIL_USERNAME: test@example.com
          MAIL_PASSWORD: test
        run: docker-compose build
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: card/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Tests
        run: mvn -B test

  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: unit-test
    defaults:
      run:
        working-directory: card/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Package JAR
        run: mvn -B package -DskipTests

      - name: Build Docker Image
        run: docker build -t card-game-backend:latest .

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: card/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: card/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build
