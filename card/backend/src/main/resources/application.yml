server:
  port: 8080

spring:
  application:
    name: backend

  # 默认激活 dev profile
  profiles:
    active: dev

  # 数据源（MySQL，通过环境变量注入）
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cardgame?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true

  # SQL 初始化（卡牌数据 + 人物数据）
  sql:
    init:
      mode: always
      encoding: UTF-8
      data-locations: classpath:data.sql,classpath:character.sql

  # 邮件配置（163 SMTP SSL）
  mail:
    host: ${MAIL_HOST:smtp.163.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          ssl:
            enable: true
          starttls:
            enable: false

# 应用自定义配置
app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-in-production-32chars}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
    remember-me-expiration-hours: ${JWT_REMEMBER_ME_EXPIRATION_HOURS:336}

  verification:
    code-expiry-minutes: ${VERIFICATION_CODE_EXPIRY_MINUTES:10}
    resend-cooldown-seconds: ${VERIFICATION_RESEND_COOLDOWN_SECONDS:60}

  mail:
    from: ${MAIL_FROM:noreply@example.com}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

  upload:
    avatar-dir: ${AVATAR_UPLOAD_DIR:uploads/avatars}
