version: "3.8"

services:
  # ===== MySQL 数据库 =====
  mysql:
    image: mysql:8.0
    container_name: cardgame-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-cardgame}
      MYSQL_CHARSET: utf8mb4
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cardgame-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== 后端 Spring Boot =====
  backend:
    build:
      context: ./card/backend
      dockerfile: Dockerfile
    container_name: cardgame-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-cardgame}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cardgame-net

  # ===== 前端 Nginx =====
  frontend:
    build:
      context: ./card/frontend
      dockerfile: Dockerfile
    container_name: cardgame-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - cardgame-net

volumes:
  mysql_data:

networks:
  cardgame-net:
    driver: bridge
